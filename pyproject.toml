[project]
name = "Cardiometabolic-Burden-as-Effect-Modifier"
version = "1.0"
description = "Do cardiometabolic factors such as hypertension, obesity, and diabetes modify the effect of socioeconomic conditions on anxiety and depressive symptoms among ever-married women in Bangladesh?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pyreadstat>=1.3.5",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["tools"]

